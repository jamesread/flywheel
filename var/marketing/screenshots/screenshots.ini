# Marketing screenshots, captured by `make` in this directory against the
# throwaway frontend it starts (see Makefile / seed/).
#
# title/description/theme are not used by repo-helper; `make manifest` turns
# them into screenshot-manifest.yaml for indexers. Every section needs them.

[DEFAULT]
base_url = http://127.0.0.1:18400/
dir = .
width = 1280
height = 800
script = scripts/light.py, scripts/seed.py, scripts/prepare.py
post_script_sleep = 1.5
theme = light
manifest_project = Flywheel
manifest_base_url = https://raw.githubusercontent.com/jamesread/flywheel/main/var/marketing/screenshots/

[home]
url = .
title = Today's habits
description = Tick off each habit as you complete it today. Completed habits turn green, so you can see at a glance what is left.

[edit]
url = .
script = scripts/light.py, scripts/seed.py, scripts/prepare.py, scripts/edit.py
title = Edit your habit list
description = Add new habits, drag them into the order you do them, or remove the ones you no longer need.

[mobile]
url = .
width = 390
height = 844
title = On your phone
description = Flywheel is an installable Progressive Web App, so it works like a native app on your phone. Your habits stay on your device, with no account or server.

# Dark variants last; the browser session (and emulated media) is shared.
[home-dark]
url = .
script = scripts/dark.py, scripts/seed.py, scripts/prepare.py
theme = dark
title = Dark mode
description = Flywheel follows your system's light or dark setting automatically.
