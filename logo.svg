<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="512"
   height="512"
   viewBox="0 0 512 512"
   version="1.1"
   id="svg4"
   xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient
       id="ringGradient"
       x1="256"
       y1="32"
       x2="256"
       y2="480"
       gradientUnits="userSpaceOnUse">
      <stop offset="0" style="stop-color:#d4ec9d;stop-opacity:1" />
      <stop offset="0.63" style="stop-color:#b1e24e;stop-opacity:1" />
      <stop offset="1" style="stop-color:#b1e24e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Donut: outer radius 224, inner radius 120, centred on 256,256 -->
  <path
     id="ring"
     style="fill:url(#ringGradient);fill-rule:evenodd;stroke:none"
     d="M 256,32 A 224,224 0 1 1 256,480 A 224,224 0 1 1 256,32 Z M 256,136 A 120,120 0 1 0 256,376 A 120,120 0 1 0 256,136 Z" />
  <path
     id="ring-outline"
     style="fill:none;stroke:#000000;stroke-width:20.7874;stroke-linecap:butt;stroke-linejoin:bevel;stroke-opacity:1"
     d="M 256,32 A 224,224 0 1 1 256,480 A 224,224 0 1 1 256,32 Z M 256,136 A 120,120 0 1 0 256,376 A 120,120 0 1 0 256,136 Z" />
  <!-- Chevron arrows every 90 degrees, pointing clockwise -->
  <g
     id="arrows"
     style="fill:none;stroke:#000000;stroke-width:20.7874;stroke-linecap:round;stroke-linejoin:round;stroke-opacity:1">
    <polyline points="246,64 266,84 246,104" />
    <polyline points="246,64 266,84 246,104" transform="rotate(90 256 256)" />
    <polyline points="246,64 266,84 246,104" transform="rotate(180 256 256)" />
    <polyline points="246,64 266,84 246,104" transform="rotate(270 256 256)" />
  </g>
</svg>
